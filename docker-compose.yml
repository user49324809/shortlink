services:
  app:
    build:
      context: .
      dockerfile: dockerfile
    container_name: yii2_app
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: shortlink_qr
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      COOKIE_VALIDATION_KEY: ${COOKIE_VALIDATION_KEY:-development-only-key}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
    depends_on:
      - db

  db:
    image: mariadb:10.5
    container_name: yii2_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_DATABASE: shortlink_qr
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data:
